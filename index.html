      <script>
        window.addEventListener('error', function(e) {
          var src = (e && e.target && (e.target.src || e.target.href)) || '';
          if (src && src.indexOf(window.location.origin) !== 0 && src.indexOf('tailwindcss.com') === -1) {
            return;
          }
          setTimeout(function() {
            var errBox = document.getElementById('ss-error-container');
            if (errBox) errBox.style.display = 'block';
